name: Encrypted Receipt Backup

on:
  workflow_dispatch:
  schedule:
    # Sunday 03:30 UTC = Sunday 10:30 Asia/Bangkok
    - cron: '30 3 * * 0'

permissions:
  contents: read
  issues: write

concurrency:
  group: inflow-receipt-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Validate backup secrets
        shell: bash
        run: |
          set -euo pipefail
          for key in VITE_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY BACKUP_PASSPHRASE; do
            if [ -z "${!key:-}" ]; then
              echo "Missing production environment secret: $key" >&2
              exit 1
            fi
          done
          if [ "${#BACKUP_PASSPHRASE}" -lt 20 ]; then
            echo "BACKUP_PASSPHRASE must be at least 20 characters" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Export private expense receipts
        run: node scripts/export_receipts.mjs

      - name: Encrypt receipt archive
        shell: bash
        run: |
          set -euo pipefail
          TS=$(date -u '+%Y%m%dT%H%M%SZ')
          RAW="/tmp/inflow-receipts-${TS}.tar.gz"
          ENC="backup/inflow-receipts-${TS}.tar.gz.enc"
          SHA="${ENC}.sha256"
          tar -C backup -czf "$RAW" receipts
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$RAW" \
            -out "$ENC" \
            -pass env:BACKUP_PASSPHRASE
          sha256sum "$ENC" > "$SHA"
          rm -rf backup/receipts "$RAW"
          echo "RECEIPT_BACKUP_FILE=$ENC" >> "$GITHUB_ENV"
          echo "RECEIPT_BACKUP_SHA=$SHA" >> "$GITHUB_ENV"

      - name: Offline archive validation
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "$RECEIPT_BACKUP_SHA"
          VERIFY_ARCHIVE="/tmp/inflow-receipts-validation.tar.gz"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$RECEIPT_BACKUP_FILE" \
            -out "$VERIFY_ARCHIVE" \
            -pass env:BACKUP_PASSPHRASE
          tar -tzf "$VERIFY_ARCHIVE" > /tmp/inflow-receipts-list.txt
          test -s /tmp/inflow-receipts-list.txt
          grep -Eq '^receipts/?$|^receipts/' /tmp/inflow-receipts-list.txt
          rm -f "$VERIFY_ARCHIVE" /tmp/inflow-receipts-list.txt

      - name: Upload encrypted receipt artifact
        uses: actions/upload-artifact@v4
        with:
          name: inflow-receipts-backup-${{ github.run_id }}
          path: |
            ${{ env.RECEIPT_BACKUP_FILE }}
            ${{ env.RECEIPT_BACKUP_SHA }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Notify owner on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="🚨 INFLOW: Receipt Backup ล้มเหลว"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          BODY="Encrypted Receipt Backup ล้มเหลว กรุณาตรวจสอบ GitHub Actions ทันที\n\nRun: ${RUN_URL}\nCommit: ${GITHUB_SHA}\nเวลา (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --assignee "$GITHUB_REPOSITORY_OWNER"
          fi

      - name: Resolve previous failure alert
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="🚨 INFLOW: Receipt Backup ล้มเหลว"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "✅ Receipt Backup กลับมาทำงานปกติแล้วใน run ${GITHUB_RUN_ID}."
          fi

      - name: Summary
        if: success()
        run: |
          echo "## INFLOW Encrypted Receipt Backup" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Private Storage receipt export: completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Encryption: AES-256-CBC + PBKDF2" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256 integrity check: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Offline decrypt + tar archive validation: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact retention: 14 days" >> "$GITHUB_STEP_SUMMARY"
          echo "- Unencrypted receipt files removed before artifact upload" >> "$GITHUB_STEP_SUMMARY"
          echo "- Failure alert: GitHub Issue assigned to repository owner" >> "$GITHUB_STEP_SUMMARY"
