name: Production Health Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/production_health_check.sql'
      - 'scripts/backoffice_rollback_test.sql'
      - '.github/workflows/production-health-check.yml'
  schedule:
    # 02:00 UTC = 09:00 Asia/Bangkok
    - cron: '0 2 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: inflow-production-health
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate database connection secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "Missing production environment secret: SUPABASE_DB_URL" >&2
            exit 1
          fi

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Production data and security health check
        shell: bash
        run: psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f scripts/production_health_check.sql

      - name: Back-office regression test with rollback
        shell: bash
        run: psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f scripts/backoffice_rollback_test.sql

      - name: Notify owner on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="🚨 INFLOW: Production Health Check ล้มเหลว"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          BODY="Production Health Check ล้มเหลว กรุณาตรวจสอบระบบขาย/สต็อก/ความถูกต้องของข้อมูลโดยเร็ว\n\nRun: ${RUN_URL}\nCommit: ${GITHUB_SHA}\nเวลา (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --assignee "$GITHUB_REPOSITORY_OWNER"
          fi

      - name: Resolve previous failure alert
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="🚨 INFLOW: Production Health Check ล้มเหลว"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "✅ Production Health Check กลับมาทำงานปกติแล้วใน run ${GITHUB_RUN_ID}."
          fi

      - name: Summary
        if: success()
        run: |
          echo "## INFLOW Production Health Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Security/data integrity checks: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Back-office transaction regression: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Regression test data: rolled back" >> "$GITHUB_STEP_SUMMARY"
          echo "- Failure alert: GitHub Issue assigned to repository owner" >> "$GITHUB_STEP_SUMMARY"
          echo "- Checked at: $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
