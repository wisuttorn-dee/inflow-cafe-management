name: Deploy Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'tailwind.config.*'
      - 'postcss.config.*'
      - '.github/workflows/deploy-cloudflare-pages.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      PRODUCTION_URL: https://inflow-cafe-management.pages.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Validate required deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required GitHub Environment secret: $key" >&2
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Create Pages project if needed
        run: npx --yes wrangler@4.130.0 pages project create inflow-cafe-management --production-branch=main || true

      - name: Deploy production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.130.0 pages deploy dist \
            --project-name=inflow-cafe-management \
            --branch=main \
            --commit-hash="${{ github.sha }}" \
            --commit-message="INFLOW production deployment" | tee /tmp/cloudflare-deploy.log
          DEPLOYMENT_URL=$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' /tmp/cloudflare-deploy.log | tail -n 1 || true)
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "Could not detect the Cloudflare Pages deployment URL." >&2
            exit 1
          fi
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Deployment URL: $DEPLOYMENT_URL"

      - name: Wait for production hostname
        shell: bash
        run: sleep 8

      - name: Smoke test deployed SPA
        shell: bash
        run: |
          set -euo pipefail
          CURL_FLAGS=(
            --fail
            --silent
            --show-error
            --location
            --retry 12
            --retry-delay 3
            --retry-all-errors
            --connect-timeout 10
            --max-time 30
          )
          curl "${CURL_FLAGS[@]}" "$PRODUCTION_URL/" > /tmp/index.html
          grep -qi '<div id="root"' /tmp/index.html
          curl "${CURL_FLAGS[@]}" "$PRODUCTION_URL/dashboard" > /tmp/dashboard.html
          grep -qi '<div id="root"' /tmp/dashboard.html
          echo "Cloudflare Pages smoke test passed: $PRODUCTION_URL"

      - name: Notify owner on deployment failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="🚨 INFLOW: Production Deployment ล้มเหลว"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          BODY="การ deploy INFLOW ไป Cloudflare Pages ล้มเหลว กรุณาตรวจสอบ GitHub Actions\n\nRun: ${RUN_URL}\nCommit: ${GITHUB_SHA}\nเวลา (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --assignee "$GITHUB_REPOSITORY_OWNER"
          fi

      - name: Resolve previous deployment alert
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="🚨 INFLOW: Production Deployment ล้มเหลว"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "✅ Production Deployment กลับมาทำงานปกติแล้วใน run ${GITHUB_RUN_ID}."
          fi

      - name: Deployment summary
        if: success()
        run: |
          echo "## INFLOW Cloudflare Pages deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Production URL: $PRODUCTION_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Version URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "SPA root and nested-route smoke tests passed." >> "$GITHUB_STEP_SUMMARY"
          echo "Automatic deployment: enabled for frontend changes on main." >> "$GITHUB_STEP_SUMMARY"
